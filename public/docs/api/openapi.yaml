servers:
  -
    url: 'http://localhost'
paths:
  /api/v1/contact-us:
    get:
      summary: '1. Contact Us Form Submission'
      description: ''
      parameters:
        -
          in: query
          name: full_name
          description: 'Fullname of requestor.'
          example: Adam
          required: true
          schema:
            type: string
            description: 'Fullname of requestor.'
            example: Adam
        -
          in: query
          name: email
          description: 'email of requestor.'
          example: adameve@mail.com
          required: true
          schema:
            type: string
            description: 'email of requestor.'
            example: adameve@mail.com
        -
          in: query
          name: phone_number
          description: 'phone number of requestor.'
          example: '0123878123'
          required: false
          schema:
            type: string
            description: 'phone number of requestor.'
            example: '0123878123'
        -
          in: query
          name: location
          description: 'location of requestor.'
          example: Selangor
          required: false
          schema:
            type: string
            description: 'location of requestor.'
            example: Selangor
        -
          in: query
          name: model
          description: 'Model selected by requestor. Example Intrix 5-In-1'
          example: debitis
          required: false
          schema:
            type: string
            description: 'Model selected by requestor. Example Intrix 5-In-1'
            example: debitis
        -
          in: header
          name: Content-Type
          description: ''
          example: application/json
          schema:
            type: string
        -
          in: header
          name: Accept
          description: ''
          example: application/json
          schema:
            type: string
