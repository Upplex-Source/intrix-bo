name: 'Promo Code API'
description: ''
endpoints:
  -
    httpMethods:
      - GET
    uri: api/v1/promo-codes
    metadata:
      title: '1. Get promo code'
      description: |-
        <aside class="notice">Get all voucher that is claimable</aside>

        <strong>voucher discount type</strong></br>
        1: percentage<br>
        2: fixed amount<br>
        3: buy x free y<br>
      authenticated: true
      custom: []
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    queryParameters:
      per_page:
        name: per_page
        description: 'Retrieve how many product in a page, default is 10.'
        required: false
        example: 10
        type: integer
        custom: []
      promo_code:
        name: promo_code
        description: 'The promo code to be filter.'
        required: false
        example: XBMSD22
        type: string
        custom: []
      discount_type:
        name: discount_type
        description: 'The promo discount type to be filter'
        required: false
        example: 2
        type: integer
        custom: []
    bodyParameters: []
    responses:
      -
        status: 200
        content: '{"message":"","message_key":"get_voucher_success","data":[]}'
        headers:
          cache-control: 'no-cache, private'
          content-type: application/json
          x-ratelimit-limit: '100'
          x-ratelimit-remaining: '97'
          access-control-allow-origin: '*'
        description: null
    responseFields: []
  -
    httpMethods:
      - POST
    uri: api/v1/promo-codes/validate
    metadata:
      title: '3. validate voucher ( Apply Voucher )'
      description: |-
        <strong>payment_plan</strong></br>
        1: upfront<br>
        2: monthly<br>
        3: outright<br>

        <strong>color</strong></br>
        1: CHROME<br>
        2: MATTE BLACK<br>
        3: SATIN GOLD<br>
        4: GUNMETAL GREY<br>

        <strong>type</strong></br>
        1: BUY NOW<br>
        2: CART<br>
      authenticated: false
      custom: []
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    queryParameters:
      session_key:
        name: session_key
        description: 'optional The unique identifier for the cart. Must be provided if type is 2'
        required: false
        example: abcd-1234
        type: string
        custom: []
    bodyParameters:
      type:
        name: type
        description: 'To verify cart or buy now product, Set 2 to validate cart .'
        required: true
        example: 1
        type: integer
        custom: []
      promo_code:
        name: promo_code
        description: 'The ID of the promotion/voucher to apply.'
        required: true
        example: 0
        type: integer
        custom: []
      product_code:
        name: product_code
        description: 'The product_code of the product.'
        required: true
        example: 5-IN-1
        type: string
        custom: []
      color:
        name: color
        description: 'The color of the product.'
        required: true
        example: '1'
        type: string
        custom: []
      quantity:
        name: quantity
        description: 'The quantity of the product.'
        required: true
        example: 1
        type: integer
        custom: []
      payment_plan:
        name: payment_plan
        description: 'nullable The payment_plan integer for the order.'
        required: true
        example: 1
        type: integer
        custom: []
    responses: []
    responseFields: []
